<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Retiro Familiar 2026</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #f6f9f7;
      min-height: 100vh;
    }

    /* LOGIN */
    .login-screen {
      min-height: 100vh;
      background: #0a2218;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-box {
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.4);
      text-align: center;
    }

    .login-icon { font-size: 2.5rem; margin-bottom: 12px; }

    .login-box h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: #0a2218;
      margin-bottom: 6px;
    }

    .login-box p {
      font-size: 0.82rem;
      color: #4a6a5e;
      margin-bottom: 24px;
    }

    .login-box input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e8e4;
      border-radius: 10px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      color: #0a2218;
      outline: none;
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 0.2em;
    }

    .login-box input:focus { border-color: #2d7a4f; }

    .login-error {
      color: #e63946;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: none;
    }

    /* HEADER */
    .app-header {
      background: #0a2218;
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid #c9a84c;
    }

    .header-brand { display: flex; align-items: center; gap: 12px; }

    .header-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: #c9a84c;
    }

    .header-sub {
      font-size: 0.72rem;
      color: #a0c4b0;
      font-weight: 600;
    }

    /* MAIN */
    .app-main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    /* STAT GRID */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px 16px;
      box-shadow: 0 2px 8px rgba(26,58,46,0.08);
      border-top: 4px solid #2d7a4f;
      text-align: center;
    }

    .stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: #0a2218;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.72rem;
      color: #4a6a5e;
      margin-top: 6px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ACTIONS */
    .actions-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 0.88rem;
      font-weight: 800;
      transition: all 0.2s;
    }

    .btn--primary { background: #2d7a4f; color: #fff; }
    .btn--primary:hover { background: #0a2218; }
    .btn--outline { background: transparent; border: 2px solid #e0e8e4; color: #0a2218; }
    .btn--outline:hover { border-color: #2d7a4f; }
    .btn--danger { background: #fff0f0; color: #e63946; border: 2px solid transparent; }
    .btn--danger:hover { background: #e63946; color: #fff; }
    .btn--sm { padding: 7px 12px; font-size: 0.8rem; }

    /* TABLE */
    .table-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(26,58,46,0.08);
      overflow: hidden;
    }

    .table-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e0e8e4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .table-header h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      color: #0a2218;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead tr { background: #0a2218; }

    thead th {
      padding: 12px 16px;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 800;
      color: #c9a84c;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    tbody tr { border-bottom: 1px solid #f0f4f1; transition: background 0.15s; }
    tbody tr:hover { background: #f6f9f7; }
    tbody tr:last-child { border-bottom: none; }

    tbody td {
      padding: 12px 16px;
      font-size: 0.85rem;
      color: #1a3a2e;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 800;
      background: #d8f3dc;
      color: #0a2218;
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: #9ab5a8;
    }

    .empty-icon { font-size: 3rem; margin-bottom: 12px; }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #0a2218;
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.9rem;
      z-index: 999;
      display: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    @media (max-width: 600px) {
      table { display: block; overflow-x: auto; }
      .stat-grid { grid-template-columns: 1fr 1fr 1fr; }
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <div class="login-icon">⛺</div>
      <h2>Admin — Retiro 2026</h2>
      <p>Ingrese la contraseña de acceso / Enter access password</p>
      <input type="password" id="pinInput" placeholder="••••••" onkeydown="if(event.key==='Enter') checkPin()" />
      <div class="login-error" id="pinError">Contraseña incorrecta / Incorrect password</div>
      <button class="btn btn--primary" style="width:100%;justify-content:center;" onclick="checkPin()">
        🔐 Entrar / Enter
      </button>
    </div>
  </div>

  <!-- ADMIN APP -->
  <div id="adminApp" style="display:none">

    <header class="app-header">
      <div class="header-brand">
        <div>
          <div class="header-title">⛺ Retiro Familiar 2026</div>
          <div class="header-sub">Juntos en Cada Etapa · Admin Panel</div>
        </div>
      </div>
      <button class="btn btn--outline btn--sm" onclick="logout()" style="color:#a0c4b0;border-color:#2d7a4f;">
        🚪 Salir
      </button>
    </header>

    <main class="app-main">

      <!-- STATS -->
      <div class="stat-grid" id="statsGrid"></div>

      <!-- ACTIONS -->
      <div class="actions-bar">
        <button class="btn btn--primary" onclick="loadData()">🔄 Actualizar</button>
        <button class="btn btn--outline" onclick="exportCSV()">📥 Exportar CSV</button>
      </div>

      <!-- TABLE -->
      <div class="table-card">
        <div class="table-header">
          <h3>Familias registradas</h3>
          <span id="totalBadge" class="badge">0 familias</span>
        </div>
        <div id="tableContent"></div>
      </div>

    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ── FIREBASE ──
    const firebaseConfig = {
      apiKey: "AIzaSyBE2GlWTPqR5cq7gvsB0Ki7cHHUtIQLHbA",
      authDomain: "youth-camp-emanuel.firebaseapp.com",
      projectId: "youth-camp-emanuel",
      storageBucket: "youth-camp-emanuel.firebasestorage.app",
      messagingSenderId: "859937890504",
      appId: "1:859937890504:web:e1e1e8bf8bb97b750b85fd"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ── PIN — cámbialo aquí ──
    const ADMIN_PIN = "Emanuel2026";

    let registrations = [];

    // ── LOGIN ──
    function checkPin() {
      const val = document.getElementById('pinInput').value.trim();
      if (val === ADMIN_PIN) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminApp').style.display = 'block';
        sessionStorage.setItem('retiroAdmin', '1');
        loadData();
      } else {
        document.getElementById('pinError').style.display = 'block';
        document.getElementById('pinInput').value = '';
        document.getElementById('pinInput').focus();
      }
    }

    function logout() {
      sessionStorage.removeItem('retiroAdmin');
      document.getElementById('adminApp').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('pinInput').value = '';
    }

    // Auto-login if session active
    if (sessionStorage.getItem('retiroAdmin') === '1') {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminApp').style.display = 'block';
      loadData();
    }

    // ── LOAD DATA ──
    async function loadData() {
      try {
        const snap = await db.collection('retiroFamiliar2026').orderBy('createdAt', 'desc').get();
        registrations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderStats();
        renderTable();
      } catch(e) {
        console.error(e);
        toast('❌ Error cargando datos');
      }
    }

    // ── STATS ──
    function renderStats() {
      const total    = registrations.length;
      const adults   = registrations.reduce((s,r) => s+(r.adults||0), 0);
      const singles  = registrations.reduce((s,r) => s+(r.singles||0), 0);
      const teens    = registrations.reduce((s,r) => s+(r.teens||0), 0);
      const kids     = registrations.reduce((s,r) => s+(r.kids||0), 0);
      const people   = adults + singles + teens + kids;

      const stats = [
        { num: total,   label: "Familias" },
        { num: people,  label: "Total personas" },
        { num: adults,  label: "Adultos" },
        { num: singles, label: "Solteros" },
        { num: teens,   label: "Adolescentes" },
        { num: kids,    label: "Niños" },
      ];

      document.getElementById('statsGrid').innerHTML = stats.map(s =>
        `<div class="stat-card">
          <div class="stat-num">${s.num}</div>
          <div class="stat-label">${s.label}</div>
        </div>`
      ).join('');
    }

    // ── TABLE ──
    function renderTable() {
      const badge = document.getElementById('totalBadge');
      badge.textContent = registrations.length + ' familia' + (registrations.length !== 1 ? 's' : '');

      if (!registrations.length) {
        document.getElementById('tableContent').innerHTML =
          `<div class="empty-state"><div class="empty-icon">📋</div><p>No hay registros aún</p></div>`;
        return;
      }

      document.getElementById('tableContent').innerHTML =
        `<table>
          <thead>
            <tr>
              <th>#</th>
              <th>Nombre</th>
              <th>Teléfono</th>
              <th>Adultos</th>
              <th>Solteros</th>
              <th>Adolescentes</th>
              <th>Niños</th>
              <th>Total</th>
              <th>Fecha</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${registrations.map((r, i) => `
              <tr>
                <td style="color:#9ab5a8;font-size:0.75rem">${i+1}</td>
                <td><strong>${esc(r.familyName||'')}</strong></td>
                <td>${r.phone||''}</td>
                <td style="text-align:center">${r.adults||0}</td>
                <td style="text-align:center">${r.singles||0}</td>
                <td style="text-align:center">${r.teens||0}</td>
                <td style="text-align:center">${r.kids||0}</td>
                <td style="text-align:center"><span class="badge">${r.total||0}</span></td>
                <td style="color:#9ab5a8;font-size:0.75rem">${r.createdAt ? new Date(r.createdAt).toLocaleDateString('es-US') : ''}</td>
                <td><button class="btn btn--danger btn--sm" onclick="deleteReg('${r.id}')">🗑️</button></td>
              </tr>
            `).join('')}
            <tr style="background:#f0f4f1;font-weight:800;">
              <td colspan="3" style="padding:12px 16px;color:#0a2218;">TOTAL</td>
              <td style="text-align:center">${registrations.reduce((s,r)=>s+(r.adults||0),0)}</td>
              <td style="text-align:center">${registrations.reduce((s,r)=>s+(r.singles||0),0)}</td>
              <td style="text-align:center">${registrations.reduce((s,r)=>s+(r.teens||0),0)}</td>
              <td style="text-align:center">${registrations.reduce((s,r)=>s+(r.kids||0),0)}</td>
              <td style="text-align:center"><span class="badge" style="background:#c9a84c;color:#0a2218">${registrations.reduce((s,r)=>s+(r.total||0),0)}</span></td>
              <td colspan="2"></td>
            </tr>
          </tbody>
        </table>`;
    }

    // ── DELETE ──
    async function deleteReg(id) {
      if (!confirm('¿Eliminar este registro?')) return;
      await db.collection('retiroFamiliar2026').doc(id).delete();
      registrations = registrations.filter(r => r.id !== id);
      renderStats();
      renderTable();
      toast('🗑️ Registro eliminado');
    }

    // ── EXPORT CSV ──
    function exportCSV() {
      const headers = ['#','Nombre','Teléfono','Adultos','Solteros','Adolescentes','Niños','Total','Fecha'];
      const rows = registrations.map((r, i) => [
        i+1, r.familyName, r.phone,
        r.adults||0, r.singles||0, r.teens||0, r.kids||0, r.total||0,
        r.createdAt ? new Date(r.createdAt).toLocaleDateString('es-US') : ''
      ]);
      rows.push(['','TOTAL','',
        registrations.reduce((s,r)=>s+(r.adults||0),0),
        registrations.reduce((s,r)=>s+(r.singles||0),0),
        registrations.reduce((s,r)=>s+(r.teens||0),0),
        registrations.reduce((s,r)=>s+(r.kids||0),0),
        registrations.reduce((s,r)=>s+(r.total||0),0),
        ''
      ]);

      const lines = [headers, ...rows].map(row =>
        row.map(c => '"' + String(c||'').replace(/"/g,'""') + '"').join(',')
      );
      const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = 'retiro-familiar-2026.csv'; a.click();
      URL.revokeObjectURL(url);
    }

    // ── UTILS ──
    function esc(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    let toastTimer;
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.style.display = 'none', 3000);
    }
  </script>

</body>
</html>
